name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: Test before release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Aqua tools
        uses: aquaproj/aqua-installer@v4
        with:
          aqua_version: v2.67.0
          aqua_opts: "-l"

      - name: Run go vet
        run: task vet

      - name: Run tests
        run: task test:race

  release:
    name: Release
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Aqua tools
        uses: aquaproj/aqua-installer@v4
        with:
          aqua_version: v2.67.0
          aqua_opts: "-l"

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
