name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Install Aqua tools
        uses: aquaproj/aqua-installer@611554c6f0137ba41c8dd15aca8bee82504ea461 # v4.1.1
        with:
          aqua_version: v2.66.1
          aqua_opts: "-l"

      - name: Run go vet
        run: task vet

      - name: Run golangci-lint
        run: task lint

      - name: Validate lefthook
        run: task hooks:validate

      - name: Validate GoReleaser config
        run: task release:check
